server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:fhirDb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false

hapi:
  fhir:
    server-base: https://hapi.fhir.org/baseR4

logging:
  level:
    ROOT: INFO
    com.example.fhirdemo: DEBUG
    ca.uhn.fhir: WARN
    ca.uhn.hl7v2: WARN
    org.hibernate.SQL: WARN
