# Development profile: the local docker-compose stack started by
# ./scripts/start-local.sh. Every value below falls back to the placeholder in
# .env.example, and the .env file at the repository root is imported when it
# exists, so `cp .env.example .env` is enough for a fresh checkout.

spring:
  config:
    import:
      # Resolved relative to the working directory: repo root for `java -jar`,
      # the healthcare-application module directory for `spring-boot:run`.
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    # Application PostgreSQL only. The FHIR database is internal to the HAPI
    # FHIR server container and is never reached from this application.
    url: jdbc:postgresql://${APP_DB_HOST:localhost}:${APP_DB_PORT:5432}/${APP_DB_NAME:healthcare}
    username: ${APP_DB_USER:healthcare}
    password: ${APP_DB_PASSWORD:change-me-app-password}

healthcare:
  fhir:
    base-url: http://localhost:${HAPI_FHIR_PORT:8080}/fhir
